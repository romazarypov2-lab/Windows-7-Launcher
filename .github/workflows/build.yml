name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Complete Android Project Architecture
        run: |
          mkdir -p app/src/main/java/com/winexelauncher/app
          mkdir -p app/src/main/cpp
          
          # Перемещаем ваши исходные файлы кода в рабочую структуру папок
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/winexelauncher/app/MainActivity.kt
          [ -f exe_bridge.cpp ] && mv exe_bridge.cpp app/src/main/cpp/exe_bridge.cpp
          [ -f CMAKELISTS.txt ] && mv CMAKELISTS.txt app/src/main/cpp/CMakeLists.txt
          
          # Создаем корректный манифест AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com" package="com.winexelauncher.app">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:allowBackup="false" android:label="Windows 7 Launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleInstance" android:clearTaskOnLaunch="true" android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

          # Создаем правильный скрипт сборки модуля app/build.gradle
          echo 'plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.winexelauncher.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.winexelauncher.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild { cmake { cppFlags "" } }
              }
              buildTypes { release { minifyEnabled false } }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
          }' > app/build.gradle

          # Настраиваем корневой build.gradle с репозиториями
          echo "buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }" > build.gradle

          # Создаем settings.gradle с правильным подключением репозиториев для плагинов
          echo "pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'" > settings.gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5 Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compile Application APK
        run: |
          gradle :app:assembleDebug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-launcher-apk
          path: "app/build/outputs/apk/debug/*.apk"
