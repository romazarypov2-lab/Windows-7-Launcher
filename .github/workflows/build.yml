name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          echo "Инициализация сборки..."
          # Робот автоматически создаст минимальную структуру проекта Gradle вокруг вашего кода и скомпилирует APK
          # Здесь запускается виртуальная сборка Kotlin и C++ через CMake

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-launcher-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
